{% extends "base.html" %}

{% block css %}
<style>
.container {
    background: linear-gradient(135deg, #A8EDEA, #FED6E3);
    width: 420px;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.4);
    animation: fadeIn 0.8s ease-in-out;
    backdrop-filter: blur(6px);
    margin: 160px auto 60px;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #355C7D;
    font-family: 'Playfair Display', serif;
    font-size: 30px;
}

input {
    width: 96%;
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 10px;
    border: 1px solid rgba(53, 92, 125, 0.3);
    font-size: 14px;
    background: rgba(255, 255, 255, 0.55);
    color: #3A4F7A;
    outline: none;
}

input::placeholder {
    color: #7A9E9F;
}

input:focus {
    border-color: #A8EDEA;
    box-shadow: 0 0 0 3px rgba(168, 237, 234, 0.4);
}

button {
    width: 100%;
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 25px;
    cursor: pointer;
    border: none;
    background: linear-gradient(135deg, #A8EDEA, #FED6E3);
    color: #355C7D;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(0, 0, 0, 0.2);
}

p {
    text-align: center;
    margin-top: 18px;
    color: #7A9E9F;
    font-size: 14px;
}

.signup-link {
    color: #5F7ADB;
    text-decoration: none;
    font-weight: 500;
}

.signup-link:hover {
    color: #A8EDEA;
}

.footer-text {
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: #355C7D;
    font-family: 'Dancing Script', cursive;
}
</style>
{% endblock %}


{% block content %}
<div class="container">

    <h2>Sign In</h2>

    <form method="POST" action="/signin">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <input type="hidden" name="next" value="{{ request.args.get('next')}}">
        <button type="submit">Sign In</button>
    </form>

    <p>
        New user?
        <a href="/signup" class="signup-link">Sign Up</a>
    </p>

    <div class="footer-text">
        Rajalakshmi Engineering College • User Portal
    </div>

</div>
{% endblock %}
