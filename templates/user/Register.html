{% extends "base.html" %}

{% block css %}
<style>
    .container {
        background: linear-gradient(135deg, #A8EDEA, #FED6E3);
        width: 420px;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 0 30px rgba(255, 255, 255, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.3);
        animation: fadeIn 0.8s ease-in-out;
        margin: 160px auto 60px;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    h1 {
        text-align: center;
        margin-bottom: 25px;
        color: #355C7D;
        letter-spacing: 1px;
        font-family: 'Playfair Display', serif;
        font-size: 30px;
    }

    label {
        font-weight: 500;
        margin-bottom: 6px;
        display: block;
        color: #7A9E9F;
        font-size: 14px;
    }

    input {
        width: 96%;
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 8px;
        border: none;
        font-size: 14px;
    }

    select {
        width: 100%;
        color: #7A9E9F;
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 8px;
        border: none;
        font-size: 14px;
    }

    .logout {
        text-align: right;
        margin-bottom: 20px;
    }

    .logout a {
        text-decoration: none;
        color: #355C7D;
        font-weight: 600;
        border: 2px solid #355C7D;
        padding: 6px 14px;
        border-radius: 8px;
    }

    input:focus, select:focus {
        outline: none;
        box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
    }

    button {
        width: 100%;
        padding: 12px;
        font-size: 15px;
        font-weight: 600;
        border-radius: 10px;
        cursor: pointer;
        border: none;
    }

    .register-btn,
    .certificate-btn {
        background: linear-gradient(135deg,#FED6E3, #A8EDEA);
        color: #355C7D;
        border: 1px solid rgba(22, 21, 21, 0.3);
        margin-top: 10px;
    }

    hr {
        margin: 25px 0;
        border: none;
        height: 1px;
        background: rgba(11, 11, 11, 0.4);
    }

    .footer-text {
        text-align: center;
        margin-top: 15px;
        font-size: 13px;
        color: #355C7D;
        font-family: 'Dancing Script', cursive;
    }
</style>
{% endblock %}


{% block content %}
<div class="container">

    <h1>Event Registration</h1>

    <form method="POST" action="/register">

        <label>Name</label>
        <input type="text" name="name" required>

        <label>Phone Number</label>
        <input type="text" name="phone" required>

        <label>Email ID</label>
        <input type="email" name="email" required>

        <label>College Name</label>
        <input type="text" name="college" required>

        <label>Technical Event</label>
        <select name="technical_event" required>
            <option value="">Select an option</option>
            <option>Not Interested</option>
            <option>Paper Presentation</option>
            <option>Hackathon</option>
            <option>Coding Contest</option>
            <option>Debugging Challenge</option>
        </select>

        <label>Non-Technical Event</label>
        <select name="non_technical_event" required>
            <option value="">Select an option</option>
            <option>Not Interested</option>
            <option>Photography</option>
            <option>Quiz</option>
            <option>Treasure Hunt</option>
            <option>Connections</option>
        </select>

        <button type="submit" class="register-btn">Register</button>
    </form>

    <hr>

    <a href="/certificate">
        <button type="button" class="certificate-btn">
            Download Certificate
        </button>
    </a>

    <div class="footer-text">
        Rajalakshmi Engineering College • Event Portal
    </div>

</div>
{% endblock %}
